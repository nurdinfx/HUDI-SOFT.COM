      height: 100vh;
    }
  </style>
  <script>
    (function() {
      if (window.location.protocol.startsWith('http')) {
        var path = window.location.pathname;
        if (path === '/order' || path.startsWith('/order/') || path === '/menu' || path.startsWith('/menu/')) {
          window.location.replace('/#' + path + window.location.search);
        }
      }
    })();
  </script>
