services:
  - type: web
    name: hudi-soft-hms-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set these in the Render dashboard — do NOT hardcode secrets here:
      # MONGO_URI
      # JWT_SECRET
      # FRONTEND_URL
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: hudi-pos-online-aetz
    runtime: node
    rootDir: Hudi-soft-pos.online/mama-africa2-main/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — do NOT hardcode secrets here:
      # MONGO_URI
      # JWT_SECRET
      # PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: web
    name: hudi-soft-com-2
    runtime: node
    rootDir: clinicsystem all/backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 6000
      - key: HUDI_SOFT_API_URL
        value: https://hudi-soft-com.onrender.com/api
      # Set these in the Render dashboard — do NOT hardcode secrets here:
      # DATABASE_URL
      # JWT_SECRET
    healthCheckPath: /api/health
    autoDeploy: true

