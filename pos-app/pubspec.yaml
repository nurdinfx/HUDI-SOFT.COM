name: pos_app
description: HUDI-SOFT POS Flutter App - Professional Point of Sale System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & Networking
  http: ^1.2.0
  socket_io_client: ^2.0.3+1

  # Local Storage / Persistence
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Bluetooth Printing (ESC/POS)
  blue_thermal_printer: ^1.1.3

  # UI / Icons
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0

  # Barcode Scanner
  mobile_scanner: ^3.5.6

  # Charts
  fl_chart: ^0.66.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
